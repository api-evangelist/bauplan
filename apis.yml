name: Bauplan

image: https://cdn.prod.website-files.com/6815c48ebd95a588d14e383b/68c42ab94ffd08a4445ca1ea_open%20graph.jpg

description: Bauplan provides a serverless data platform enabling AI agents to safely build, version, and deploy data pipelines directly on S3
  using Python. It offers isolated execution, transactional guarantees, and atomic publishing, allowing developers to run AI‑generated code on
  production data without risk. The platform integrates with major warehouses and orchestration tools, delivering a versioned lakehouse experience
  for fast, reliable data engineering.

